# Profile for the resiliency integration tests.
#
# Deliberately NOT reusing "test": these tests need their own route definitions (so each
# test can point at its own stub backend) and their own aggressive breaker/limiter
# settings (so tripping them takes milliseconds rather than the production 10s).
spring.application.name=api-gateway-resiliency-test
spring.cloud.config.enabled=false
eureka.client.enabled=false
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/gl5/protocol/openid-connect/certs

# Auth is not the subject here, and a real JWT decoder would need a live Keycloak.
# Tests that care about authentication keep using the existing security test classes.
spring.cloud.gateway.routes.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

# --- Circuit breaker: trip fast, recover fast ---
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=4
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=4
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=2s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.health-indicator.enabled=true

# --- Rate limiter ---
# Bucket4j reads its per-route capacity from the route filter args
# (bucket4j-rate-limiter.*), set per test in GatewayResiliencyIntegrationTest.

# --- Bulkhead: 2 concurrent calls per route so a third concurrent call is shed ---
gateway.bulkhead.enabled=true
gateway.bulkhead.max-concurrent=2
gateway.bulkhead.routes=

management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always