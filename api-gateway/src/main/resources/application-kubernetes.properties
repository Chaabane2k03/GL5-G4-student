# ==========================================================================
# Kubernetes profile - activate with SPRING_PROFILES_ACTIVE=kubernetes.
#
# Inside the cluster there is no Eureka and no Config Server: routes resolve
# straight to the in-cluster Services (Kubernetes DNS) instead of lb:// via
# Eureka, and the OIDC issuer points at the in-cluster Keycloak. Every value
# can be overridden with environment variables from the Deployment manifest.
# ==========================================================================

# --- No Config Server: the config-server import lives in application.yml
#     behind on-profile "!kubernetes", so with this profile active that
#     document is skipped and no fetch is ever attempted. This flag is an
#     extra belt-and-braces guard. ---
spring.cloud.config.enabled=false

# --- No Eureka: routes use direct service URLs (below), so no registry. ---
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# --- Route targets: Kubernetes Service DNS, Service port (the
#     mock-services.yaml Services expose port 80). Each default can be
#     overridden with DEPARTMENT_SERVICE_URL / COURSE_SERVICE_URL /
#     ENROLLMENT_SERVICE_URL / STUDENT_SERVICE_URL. ---
department.service.url=${DEPARTMENT_SERVICE_URL:http://department-service}
course.service.url=${COURSE_SERVICE_URL:http://course-service}
enrollment.service.url=${ENROLLMENT_SERVICE_URL:http://enrollment-service}
student.service.url=${STUDENT_SERVICE_URL:http://student-service}

# --- OIDC issuer: in-cluster Keycloak realm (override with
#     KEYCLOAK_ISSUER_URI when the realm/hostname differs). ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/gl5}
