spring.application.name=api-gateway
server.port=8072

# Environment-specific settings come from the Config Server
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8071}
spring.cloud.config.username=${CONFIG_USER:config}
spring.cloud.config.password=${CONFIG_PASSWORD:change-me}
spring.cloud.config.fail-fast=false

# Eureka service registry configuration
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:true}

# Spring Cloud Gateway dynamic route discovery from Eureka
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always

