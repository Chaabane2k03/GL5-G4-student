spring.application.name=api-gateway
server.port=8072

# Environment-specific settings come from the Config Server.
# NOTE: spring.config.import lives in application.yml under the guarded document
# (on-profile "!kubernetes") so the kubernetes profile never contacts the Config
# Server; every other profile keeps today's behaviour.
spring.cloud.config.username=${CONFIG_USER:config}
spring.cloud.config.password=${CONFIG_PASSWORD:change-me}
spring.cloud.config.fail-fast=false

# Eureka service registry configuration
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:true}

# Explicit routes: /<context-path>/** is forwarded as-is (each service keeps its
# own server.servlet.context-path). lb:// resolves the instance via Eureka, so the
# same config works on localhost and inside the docker network. The target URL is
# overridable per backend: the kubernetes profile points <service>.service.url at
# the in-cluster Service (also overridable with e.g. DEPARTMENT_SERVICE_URL), and
# an unset URL keeps the default lb:// (Eureka) behaviour.
spring.cloud.gateway.server.webflux.routes[0].id=department-service
spring.cloud.gateway.server.webflux.routes[0].uri=${department.service.url:lb://department-service}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/department/**

spring.cloud.gateway.server.webflux.routes[1].id=course-service
spring.cloud.gateway.server.webflux.routes[1].uri=${course.service.url:lb://course-service}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/course/**

spring.cloud.gateway.server.webflux.routes[2].id=enrollment-service
spring.cloud.gateway.server.webflux.routes[2].uri=${enrollment.service.url:lb://enrollment-service}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/enrollment/**

spring.cloud.gateway.server.webflux.routes[3].id=student-service
spring.cloud.gateway.server.webflux.routes[3].uri=${student.service.url:lb://student-service}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/student/**

# Auto-routes from Eureka are disabled: routing is explicit above. Re-enable to
# also expose every registered service under /<service-id>/**.
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# Preserve the original Host header so the springdoc-generated "servers" URL of each
# backend service points back at the gateway (e.g. http://localhost:8072/department).
# This is what makes "Try it out" in the aggregated Swagger UI hit the right route.
spring.cloud.gateway.server.webflux.default-filters[0]=PreserveHostHeader

# Swagger / OpenAPI: the gateway serves its own spec and aggregates every backend
# service's document (proxied through the routes above) in a single Swagger UI.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls[0].name=Course Service
springdoc.swagger-ui.urls[0].url=/course/v3/api-docs
springdoc.swagger-ui.urls[1].name=Department Service
springdoc.swagger-ui.urls[1].url=/department/v3/api-docs
springdoc.swagger-ui.urls[2].name=Enrollment Service
springdoc.swagger-ui.urls[2].url=/enrollment/v3/api-docs
springdoc.swagger-ui.urls[3].name=Student Service
springdoc.swagger-ui.urls[3].url=/student/v3/api-docs
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.docExpansion=none

# Actuator endpoints
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,info,gateway}
# Spring Boot 3.4+ access model: the gateway endpoint defaults to NONE.
# read-only = GET /actuator/gateway/** only; use "unrestricted" to also allow
# POST/DELETE route management at runtime.
management.endpoint.gateway.access=read-only
management.endpoint.health.show-details=always
# Liveness/readiness probes for container orchestrators:
# /actuator/health/liveness and /actuator/health/readiness (public per
# SecurityConfig's ACTUATOR_PUBLIC_PATHS).
management.endpoint.health.probes.enabled=${MANAGEMENT_HEALTH_PROBES:true}

# Graceful shutdown: on SIGTERM the app stops accepting new requests, lets
# in-flight requests finish (up to the timeout), then exits.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:30s}

# OAuth2 Resource Server (JWT)
# OIDC issuer URI (e.g. Keycloak realm: http://localhost:8080/realms/gl5)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/gl5}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI:}

# Gateway Security & Audience Settings
gateway.security.client-id=api-gateway
gateway.security.audience=api-gateway
gateway.security.swagger-public=${GATEWAY_SWAGGER_PUBLIC:true}
gateway.cors.allowed-origins=*


