spring.cloud.gateway.server.webflux.routes[3].filters[1].args.methods=GET
spring.cloud.gateway.server.webflux.routes[3].filters[1].args.statuses=BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
spring.cloud.gateway.server.webflux.routes[3].filters[1].args.backoff.firstBackoff=100ms
spring.cloud.gateway.server.webflux.routes[3].filters[1].args.backoff.maxBackoff=1s
