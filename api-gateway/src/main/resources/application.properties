spring.application.name=api-gateway
server.port=8072

# Environment-specific settings come from the Config Server.
# NOTE: spring.config.import lives in application.yml under the guarded document
# (on-profile "!kubernetes") so the kubernetes profile never contacts the Config
# Server; every other profile keeps today's behaviour.
spring.cloud.config.username=${CONFIG_USER:config}
spring.cloud.config.password=${CONFIG_PASSWORD:change-me}
spring.cloud.config.fail-fast=false

# Eureka service registry configuration
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:true}

# Explicit routes: /<context-path>/** is forwarded as-is (each service keeps its
# own server.servlet.context-path). lb:// resolves the instance via Eureka, so the
# same config works on localhost and inside the docker network. The target URL is
# overridable per backend: the kubernetes profile points <service>.service.url at
# the in-cluster Service (also overridable with e.g. DEPARTMENT_SERVICE_URL), and
# an unset URL keeps the default lb:// (Eureka) behaviour.
#
# Each route carries three resiliency filters.
#
# statusCodes on the breaker is required and easy to miss: without it the CircuitBreaker
# filter only counts transport-level errors as failures. A backend answering
# "503 Service Unavailable" is a valid HTTP response, so the breaker would stay CLOSED
# forever and never trip.
#
# Order matters: filters are applied in the
# order listed and nest inside one another, so CircuitBreaker is first and therefore
# outermost. That way the breaker records one outcome per client request instead of one
# per retry attempt, and a route that is failing hard trips on the first call rather than
# after a retry storm. Retry is listed second (inside the breaker), RequestRateLimiter
# last, so an already-throttled request is rejected before it consumes a downstream slot.
#
# The Bulkhead needs no per-route declaration: RouteBulkheadFilter applies to every route
# unless gateway.bulkhead.routes names a subset. See the gateway.bulkhead.* block below.
#
# NOTE: these properties live in the jar, but spring.config.import above means values
# served by the Config Server take precedence over them. If the resiliency filters stop
# taking effect once the Config Server is reachable, the Config Server copy of these
# routes is overriding this file.
spring.cloud.gateway.server.webflux.routes[0].id=department-service
spring.cloud.gateway.server.webflux.routes[0].uri=${department.service.url:lb://department-service}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/department/**
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.name=department-service-circuit-breaker
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.fallbackUri=forward:/fallback/department-service
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.statusCodes=500,503,504
spring.cloud.gateway.server.webflux.routes[0].filters[1].name=Retry
spring.cloud.gateway.server.webflux.routes[0].filters[1].args.retries=3
spring.cloud.gateway.server.webflux.routes[0].filters[1].args.methods=GET
spring.cloud.gateway.server.webflux.routes[0].filters[1].args.statuses=BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
spring.cloud.gateway.server.webflux.routes[0].filters[1].args.backoff.firstBackoff=100ms
spring.cloud.gateway.server.webflux.routes[0].filters[1].args.backoff.maxBackoff=1s
spring.cloud.gateway.server.webflux.routes[0].filters[1].args.backoff.factor=2
spring.cloud.gateway.server.webflux.routes[0].filters[1].args.backoff.basedOnPreviousValue=true
spring.cloud.gateway.server.webflux.routes[0].filters[1].args.jitter.randomFactor=0.5
spring.cloud.gateway.server.webflux.routes[0].filters[2].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[0].filters[2].args.rate-limiter=#{@bucket4jRateLimiter}
spring.cloud.gateway.server.webflux.routes[0].filters[2].args.key-resolver=#{@principalNameKeyResolver}
spring.cloud.gateway.server.webflux.routes[0].filters[2].args.bucket4j-rate-limiter.capacity=20
spring.cloud.gateway.server.webflux.routes[0].filters[2].args.bucket4j-rate-limiter.refillPeriod=1s
spring.cloud.gateway.server.webflux.routes[0].filters[2].args.status-code=TOO_MANY_REQUESTS
# principalNameKeyResolver keys on the authenticated JWT subject. These routes sit behind
# SecurityConfig's authenticated() catch-all, so the key is normally always present.
# The two settings below decide what happens when it is not: an empty key is allowed
# through (deny-empty-key=false) and shares one bucket, rather than being rejected with
# the filter's default 403. That keeps the aggregated Swagger UI and the public actuator
# paths working: they are optionally unauthenticated (gateway.security.swagger-public),
# and a 403 there would look like a broken page rather than a throttled one.
spring.cloud.gateway.server.webflux.routes[0].filters[2].args.deny-empty-key=false
spring.cloud.gateway.server.webflux.routes[0].filters[2].args.empty-key-status=TOO_MANY_REQUESTS

spring.cloud.gateway.server.webflux.routes[1].id=course-service
spring.cloud.gateway.server.webflux.routes[1].uri=${course.service.url:lb://course-service}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/course/**
spring.cloud.gateway.server.webflux.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.name=course-service-circuit-breaker
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.fallbackUri=forward:/fallback/course-service
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.statusCodes=500,503,504
spring.cloud.gateway.server.webflux.routes[1].filters[1].name=Retry
spring.cloud.gateway.server.webflux.routes[1].filters[1].args.retries=3
spring.cloud.gateway.server.webflux.routes[1].filters[1].args.methods=GET
spring.cloud.gateway.server.webflux.routes[1].filters[1].args.statuses=BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
spring.cloud.gateway.server.webflux.routes[1].filters[1].args.backoff.firstBackoff=100ms
spring.cloud.gateway.server.webflux.routes[1].filters[1].args.backoff.maxBackoff=1s
spring.cloud.gateway.server.webflux.routes[1].filters[1].args.backoff.factor=2
spring.cloud.gateway.server.webflux.routes[1].filters[1].args.backoff.basedOnPreviousValue=true
spring.cloud.gateway.server.webflux.routes[1].filters[1].args.jitter.randomFactor=0.5
spring.cloud.gateway.server.webflux.routes[1].filters[2].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[1].filters[2].args.rate-limiter=#{@bucket4jRateLimiter}
spring.cloud.gateway.server.webflux.routes[1].filters[2].args.key-resolver=#{@principalNameKeyResolver}
spring.cloud.gateway.server.webflux.routes[1].filters[2].args.bucket4j-rate-limiter.capacity=20
spring.cloud.gateway.server.webflux.routes[1].filters[2].args.bucket4j-rate-limiter.refillPeriod=1s
spring.cloud.gateway.server.webflux.routes[1].filters[2].args.status-code=TOO_MANY_REQUESTS
spring.cloud.gateway.server.webflux.routes[1].filters[2].args.deny-empty-key=false
spring.cloud.gateway.server.webflux.routes[1].filters[2].args.empty-key-status=TOO_MANY_REQUESTS

spring.cloud.gateway.server.webflux.routes[2].id=enrollment-service
spring.cloud.gateway.server.webflux.routes[2].uri=${enrollment.service.url:lb://enrollment-service}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/enrollment/**
spring.cloud.gateway.server.webflux.routes[2].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.name=enrollment-service-circuit-breaker
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.fallbackUri=forward:/fallback/enrollment-service
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.statusCodes=500,503,504
spring.cloud.gateway.server.webflux.routes[2].filters[1].name=Retry
spring.cloud.gateway.server.webflux.routes[2].filters[1].args.retries=3
spring.cloud.gateway.server.webflux.routes[2].filters[1].args.methods=GET
spring.cloud.gateway.server.webflux.routes[2].filters[1].args.statuses=BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
spring.cloud.gateway.server.webflux.routes[2].filters[1].args.backoff.firstBackoff=100ms
spring.cloud.gateway.server.webflux.routes[2].filters[1].args.backoff.maxBackoff=1s
spring.cloud.gateway.server.webflux.routes[2].filters[1].args.backoff.factor=2
spring.cloud.gateway.server.webflux.routes[2].filters[1].args.backoff.basedOnPreviousValue=true
spring.cloud.gateway.server.webflux.routes[2].filters[1].args.jitter.randomFactor=0.5
spring.cloud.gateway.server.webflux.routes[2].filters[2].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[2].filters[2].args.rate-limiter=#{@bucket4jRateLimiter}
spring.cloud.gateway.server.webflux.routes[2].filters[2].args.key-resolver=#{@principalNameKeyResolver}
spring.cloud.gateway.server.webflux.routes[2].filters[2].args.bucket4j-rate-limiter.capacity=20
spring.cloud.gateway.server.webflux.routes[2].filters[2].args.bucket4j-rate-limiter.refillPeriod=1s
spring.cloud.gateway.server.webflux.routes[2].filters[2].args.status-code=TOO_MANY_REQUESTS
spring.cloud.gateway.server.webflux.routes[2].filters[2].args.deny-empty-key=false
spring.cloud.gateway.server.webflux.routes[2].filters[2].args.empty-key-status=TOO_MANY_REQUESTS
spring.cloud.gateway.server.webflux.routes[2].args.status-code=TOO_MANY_REQUESTS

spring.cloud.gateway.server.webflux.routes[3].id=student-service
spring.cloud.gateway.server.webflux.routes[3].uri=${student.service.url:lb://student-service}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/student/**
spring.cloud.gateway.server.webflux.routes[3].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[3].filters[0].args.name=student-service-circuit-breaker
spring.cloud.gateway.server.webflux.routes[3].filters[0].args.fallbackUri=forward:/fallback/student-service
spring.cloud.gateway.server.webflux.routes[3].filters[0].args.statusCodes=500,503,504
