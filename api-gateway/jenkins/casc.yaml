jenkins:
  systemMessage: "api-gateway CI - managed by Configuration as Code"
  numExecutors: 2
  scmCheckoutRetryCount: 2
  mode: NORMAL

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

tool:
  jdk:
    installations:
      - name: "JDK17"
        home: "/opt/java/jdk17"
  maven:
    installations:
      - name: "Maven3"
        home: "/opt/maven"

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "sonar-token"
              secret: "${SONAR_TOKEN}"
              description: "SonarQube token (SONAR_TOKEN)"

unclassified:
  location:
    url: "${JENKINS_INTERNAL_URL}"
    adminAddress: "ci@localhost"
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "SonarQube"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonar-token"

jobs:
  - script: |
      pipelineJob('api-gateway') {
        description('CI/CD pipeline for api-gateway (build, tests, coverage, SonarQube, Docker, Nexus).')
        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/Chaabane2k03/GL5-G4-student.git') }
                branch('main')
              }
            }
            scriptPath('api-gateway/Jenkinsfile')
            lightweight(true)
          }
        }
        configure { project ->
          project / 'definition' / 'scm' / 'extensions' << 'hudson.plugins.git.extensions.impl.SparseCheckoutPaths' {
            sparseCheckoutPaths {
              'hudson.plugins.git.extensions.impl.SparseCheckoutPath' {
                path('api-gateway')
              }
            }
          }
        }
      }

