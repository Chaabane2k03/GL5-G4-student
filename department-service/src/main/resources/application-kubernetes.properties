# ==========================================================================
# Kubernetes profile - activate with SPRING_PROFILES_ACTIVE=kubernetes.
#
# Inside the cluster there is no Eureka and no Config Server: every setting
# the Config Server normally supplies (port, context path, datasource) is
# defined here with in-cluster defaults. Every value can be overridden with
# environment variables from the Deployment manifest, and secrets
# (datasource password) must always come from a Kubernetes Secret.
# ==========================================================================

# --- No Config Server: the config-server import lives in application.yml
#     behind on-profile "!kubernetes", so with this profile active that
#     document is skipped and no fetch is ever attempted. This flag is an
#     extra belt-and-braces guard. ---
spring.cloud.config.enabled=false

# --- No Eureka: the department-service is a leaf service, it only registers
#     itself in dev/docker and needs no peer URLs inside the cluster. ---
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# --- HTTP endpoint (normally served by the Config Server) ---
server.port=${SERVER_PORT:8082}
server.servlet.context-path=/department

# --- Datasource (normally served by the Config Server). The password is
#     intentionally empty here: provide it from a Secret via
#     SPRING_DATASOURCE_PASSWORD, never commit it. ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://department-db:3306/departmentdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:department}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
