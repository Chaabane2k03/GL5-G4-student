spring.application.name=department-service

# Environment-specific settings (port, context-path, datasource, jpa, eureka)
# come from the Config Server backed by the private config-repo Git repository.
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8071}
spring.cloud.config.username=${CONFIG_USER:config}
spring.cloud.config.password=${CONFIG_PASSWORD:change-me}
spring.cloud.config.fail-fast=false
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
logging.structured.format.console=logstash

springdoc.swagger-ui.path=/swagger-ui.html
