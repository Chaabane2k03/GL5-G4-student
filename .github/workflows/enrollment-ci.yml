name: enrollment-ci

on:
  push:
    branches: [feature/enrollment, develop]
    paths:
      - 'enrollment-service/**'
      - '.github/workflows/enrollment-ci.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'enrollment-service/**'
      - '.github/workflows/enrollment-ci.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enrollment-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run tests
        run: mvn -B verify

      - uses: actions/upload-artifact@v4
        with:
          name: enrollment-service-jar
          path: enrollment-service/target/*.jar

  docker-build:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t enrollment-service:${{ github.sha }} enrollment-service