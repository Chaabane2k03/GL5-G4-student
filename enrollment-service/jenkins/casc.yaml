jenkins:
  systemMessage: "enrollment-service CI - managed by Configuration as Code"
  numExecutors: 2
  scmCheckoutRetryCount: 2
  mode: NORMAL

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

tool:
  jdk:
    installations:
      - name: "JDK17"
        home: "/opt/java/jdk17"
  maven:
    installations:
      - name: "Maven3"
        home: "/opt/maven"

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "sonar-token"
              secret: "${SONAR_TOKEN}"
              description: "SonarQube token (SONAR_TOKEN)"

unclassified:
  location:
    # Internal name: SonarQube (on gl5-sonar-net) uses it to reach the Jenkins
    # webhook, so waitForQualityGate() receives its callback. Open the UI at
    # http://localhost:8093 instead.
    url: "${JENKINS_INTERNAL_URL}"
    adminAddress: "ci@localhost"
  # Shared SonarQube instance from the repository root's docker-compose.sonar.yml.
  # "sonarqube" is the network alias declared there.
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "SonarQube"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonar-token"

jobs:
  - script: |
      pipelineJob('enrollment-service') {
        description('CI/CD pipeline for enrollment-service (build, tests, coverage, SonarQube, Docker).')
        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/Chaabane2k03/GL5-G4-student.git') }
                branch('feature/enrollment')
              }
            }
            scriptPath('enrollment-service/Jenkinsfile')
            lightweight(true)
          }
        }
        // Job DSL 3732 has no sparse-checkout DSL, so inject the GitSCM extension via XML.
        configure { project ->
          project / 'definition' / 'scm' / 'extensions' << 'hudson.plugins.git.extensions.impl.SparseCheckoutPaths' {
            sparseCheckoutPaths {
              'hudson.plugins.git.extensions.impl.SparseCheckoutPath' {
                path('enrollment-service')
              }
            }
          }
        }
      }
