# ==========================================================================
# Kubernetes profile - activate with SPRING_PROFILES_ACTIVE=kubernetes.
#
# Inside the cluster there is no Eureka and no Config Server: every setting
# the Config Server normally supplies (port, context path, datasource,
# downstream URLs) is defined here with in-cluster defaults. Every value can
# be overridden with environment variables from the Deployment manifest, and
# secrets (datasource password) must always come from a Kubernetes Secret.
# ==========================================================================

# --- No Config Server: the config-server import lives in application.yml
#     behind on-profile "!kubernetes", so with this profile active that
#     document is skipped and no fetch is ever attempted. This flag is an
#     extra belt-and-braces guard. ---
spring.cloud.config.enabled=false

# --- No Eureka: peers are reached through Kubernetes Services/DNS only. ---
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# --- HTTP endpoint (normally served by the Config Server) ---
server.port=${SERVER_PORT:8083}
server.servlet.context-path=/enrollment

# --- Downstream service URLs (Kubernetes Service DNS, Service port).
#     Override when the Service exposes another port than the default 80. ---
student.service.url=${STUDENT_SERVICE_URL:http://student-service}
course.service.url=${COURSE_SERVICE_URL:http://course-service}

# --- Datasource (normally served by the Config Server). The password is
#     intentionally empty here: provide it from a Secret via
#     SPRING_DATASOURCE_PASSWORD, never commit it. ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://enrollment-db:3306/enrollmentdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
