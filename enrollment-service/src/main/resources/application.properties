spring.application.name=enrollment-service
axon.axonserver.servers=${AXON_AXONSERVER_SERVERS:${AXON_SERVER_URL:axon-server:8124}}
# Axon commands/events are Java records: XStream cannot handle records, so
# messages and events MUST use Jackson. The general serializer remains XStream
# because existing tracking tokens (and any sagas/snapshots) are XStream XML;
# switching it would make the projection processor fail to claim its token.
axon.serializer.general=${AXON_SERIALIZER_GENERAL:xstream}
axon.serializer.events=${AXON_SERIALIZER_EVENTS:jackson}
axon.serializer.messages=${AXON_SERIALIZER_MESSAGES:jackson}

# Environment-specific settings (port, context-path, datasource, jpa, eureka)
# come from the Config Server backed by the private config-repo Git repository.
# NOTE: spring.config.import lives in application.yml under the guarded document
# (on-profile "!kubernetes") so the kubernetes profile never contacts the Config
# Server; every other profile keeps today's behaviour.
spring.cloud.config.username=${CONFIG_USER:config}
spring.cloud.config.password=${CONFIG_PASSWORD:change-me}
spring.cloud.config.fail-fast=false
# Do not let Swagger UI load springdoc's Petstore default spec instead of ours.
springdoc.swagger-ui.disable-swagger-default-url=true
# Actuator: liveness/readiness probes for container orchestrators.
# Paths: <context-path>/actuator/health/liveness and .../health/readiness
# (e.g. /enrollment/actuator/health/liveness).
management.endpoint.health.probes.enabled=${MANAGEMENT_HEALTH_PROBES:true}
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,info,prometheus}
management.endpoint.health.show-details=never

# Graceful shutdown: on SIGTERM the app stops accepting new requests, lets
# in-flight requests finish (up to the timeout), then exits.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:30s}
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
logging.structured.format.console=logstash

# --- Demo async flow: EnrollmentCreated -> outbox -> RabbitMQ -> audit consumer ---
# Axon stays the internal event store; this is only an integration demo (see
# ARCHITECTURE-ROADMAP.md, section 5). Disabled by default so no broker is needed
# for local runs/tests; docker-compose.yml turns it on.
enrollment.events.enabled=${ENROLLMENT_EVENTS_ENABLED:false}
enrollment.events.publish-interval=${ENROLLMENT_EVENTS_PUBLISH_INTERVAL:2000}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
