# CI-only overrides for the course-service pipeline smoke test.
#
# develop's course-service normally loads its datasource and context-path from the
# Config Server (see config-server/src/main/resources/config/course-service*.properties).
# CI runs the service standalone, so we inject the equivalent settings as environment
# variables and disable the config/eureka clients. The `docker compose` project name and
# the base course-db service come from docker-compose.yml.
services:
  course-service:
    environment:
      SPRING_CLOUD_CONFIG_ENABLED: "false"
      EUREKA_CLIENT_ENABLED: "false"
      SPRING_DATASOURCE_URL: "jdbc:mysql://course-db:3306/course_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "course_user"
      SPRING_DATASOURCE_PASSWORD: "course_pass"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
      SPRING_SQL_INIT_MODE: "always"
      SPRING_SQL_INIT_SCHEMA_LOCATIONS: "classpath:schema.sql"
      # Standalone context-path is "/" (the Config Server would set /course); align the
      # image healthcheck with it.
      CONTEXT_PATH: "/"
