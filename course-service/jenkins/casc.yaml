jenkins:
  systemMessage: "course-service CI - managed by Configuration as Code"
  numExecutors: 2
  scmCheckoutRetryCount: 2
  mode: NORMAL

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

tool:
  jdk:
    installations:
      - name: "jdk17"
        home: "/opt/java/jdk17"
  maven:
    installations:
      - name: "maven-3.9"
        home: "/opt/maven"

credentials:
  system:
    domainCredentials:
      - credentials:
          # Consumed by the Jenkinsfile through withCredentials(). The default is
          # the credential that sonar-init enforces on the SonarQube instance
          # (docker-compose.sonar.yml); override both with SONAR_USER /
          # SONAR_PASSWORD in .env.
          - usernamePassword:
              scope: GLOBAL
              id: "sonar-creds"
              username: "${SONAR_USER:-admin}"
              password: "${SONAR_PASSWORD:-course-service-sonar}"
              description: "SonarQube credentials (SONAR_USER / SONAR_PASSWORD)"

# No sonarGlobalConfiguration on purpose: that plugin registers a webhook at
# http://host.docker.internal:8090/sonar-webhook-hook/..., which SonarQube
# 26.10 rejects because it resolves to a site-local address. The pipeline polls
# the web API for the quality gate instead, so no server entry (and no webhook)
# is needed.

unclassified:
  location:
    url: "${JENKINS_EXTERNAL_URL}"
    adminAddress: "ci@localhost"

jobs:
  - script: |
      pipelineJob('course-service') {
        description('CI/CD pipeline for course-service (build, tests, coverage, SonarQube, Docker).')
        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/Chaabane2k03/GL5-G4-student.git') }
                branch('develop')
              }
            }
            scriptPath('course-service/Jenkinsfile')
            lightweight(true)
          }
        }
        // Job DSL 3732 has no sparse-checkout DSL, so inject the GitSCM extension via XML.
        configure { project ->
          project / 'definition' / 'scm' / 'extensions' << 'hudson.plugins.git.extensions.impl.SparseCheckoutPaths' {
            sparseCheckoutPaths {
              'hudson.plugins.git.extensions.impl.SparseCheckoutPath' {
                path('course-service')
              }
            }
          }
        }
      }
