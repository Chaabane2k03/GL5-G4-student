jenkins:
  systemMessage: "course-service CI - managed by Configuration as Code"
  numExecutors: 2
  scmCheckoutRetryCount: 2
  mode: NORMAL

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

  crumbIssuer:
    standard:
      excludeClientIPFromCrumb: true

tool:
  jdk:
    installations:
      - name: "jdk17"
        home: "/opt/java/openjdk"
  maven:
    installations:
      - name: "maven-3.9"
        home: "/opt/maven"

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "sonar-token"
              secret: "${SONAR_TOKEN}"
              description: "SonarQube user token (supplied via the SONAR_TOKEN environment variable)"

unclassified:
  location:
    url: "${JENKINS_EXTERNAL_URL}"
    adminAddress: "ci@localhost"
  sonarGlobalConfiguration:
    installations:
      - name: "sonarqube"
        serverUrl: "http://host.docker.internal:9000"
        credentialsId: "sonar-token"

jobs:
  - script: |
      pipelineJob('course-service') {
        description('CI/CD pipeline for course-service (build, tests, coverage, SonarQube, Docker).')
        definition {
          cpsScm {
            scm {
              git {
                remote { url('https://github.com/Chaabane2k03/GL5-G4-student.git') }
                branch('develop')
              }
            }
            scriptPath('course-service/Jenkinsfile')
            lightweight(true)
          }
        }
        // Job DSL 3732 has no sparse-checkout DSL, so inject the GitSCM extension via XML.
        configure { project ->
          project / 'definition' / 'scm' / 'extensions' << 'hudson.plugins.git.extensions.impl.SparseCheckoutPaths' {
            sparseCheckoutPaths {
              'hudson.plugins.git.extensions.impl.SparseCheckoutPath' {
                path('course-service')
              }
            }
          }
        }
      }
