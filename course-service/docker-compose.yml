services:
  course-db:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    container_name: ${DB_CONTAINER_NAME:-course-db}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-course_db}
      MYSQL_USER: ${DB_USER:-course_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-course_pass}
    ports:
      - "${DB_HOST_PORT:-3308}:${DB_CONTAINER_PORT:-3306}"
    volumes:
      - course-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  course-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVER_PORT: ${SERVER_PORT:-8084}
    image: ${SERVICE_IMAGE:-course-service:latest}
    container_name: ${SERVICE_CONTAINER_NAME:-course-service}
    depends_on:
      course-db:
        condition: service_healthy
    environment:
      SPRING_APP_NAME: ${SPRING_APP_NAME:-course-service}
      DB_HOST: ${DB_SERVICE_NAME:-course-db}
      DB_PORT: ${DB_CONTAINER_PORT:-3306}
      DB_NAME: ${DB_NAME:-course_db}
      DB_USER: ${DB_USER:-course_user}
      DB_PASSWORD: ${DB_PASSWORD:-course_pass}
      DB_JDBC_PARAMS: "${DB_JDBC_PARAMS:-useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
      SERVER_PORT: ${SERVER_PORT:-8084}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
      JPA_OPEN_IN_VIEW: ${JPA_OPEN_IN_VIEW:-false}
      SQL_INIT_MODE: ${SQL_INIT_MODE:-always}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
      MANAGEMENT_ENDPOINTS: "${MANAGEMENT_ENDPOINTS:-health,info}"
      APP_OPENAPI_TITLE: ${APP_OPENAPI_TITLE:-Course Service API}
      APP_OPENAPI_VERSION: ${APP_OPENAPI_VERSION:-v1}
      APP_OPENAPI_DESCRIPTION: "${APP_OPENAPI_DESCRIPTION:-REST API to manage courses: create, read, update, archive and activate. Standalone service; departments are referenced by id only.}"
    ports:
      - "${SERVER_PORT:-8084}:${SERVER_PORT:-8084}"
    restart: unless-stopped

volumes:
  course-db-data:
