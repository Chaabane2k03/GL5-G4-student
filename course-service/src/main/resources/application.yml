server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: course-service
  # All environment-specific settings (datasource, jpa, eureka, context-path)
  # are served by the Config Server from the private config-repo Git repository.
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8071}
  cloud:
    config:
      username: ${CONFIG_USER:config}
      password: ${CONFIG_PASSWORD:change-me}
      fail-fast: false

management:
  endpoints:
    web:
      exposure:
        include: "${MANAGEMENT_ENDPOINTS:health,info,prometheus}"
  endpoint:
    health:
      show-details: never
      probes:
        enabled: ${MANAGEMENT_HEALTH_PROBES:true}
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      console: logstash
