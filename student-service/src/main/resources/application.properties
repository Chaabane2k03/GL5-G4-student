spring.application.name=student-service
server.port=${SERVER_PORT:8085}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3309/studentdb?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Server configuration :
server.servlet.context-path=/student

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:true}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:${HOSTNAME:localhost}}
