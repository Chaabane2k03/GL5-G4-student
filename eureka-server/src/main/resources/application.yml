
server:
  port: 8761
  # Graceful shutdown: on SIGTERM the app stops accepting new requests, lets
  # in-flight requests finish (up to the timeout), then exits.
  shutdown: graceful

spring:
  application:
    name: eureka-server
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    # Self-preservation protects the registry from network blips: when the
    # number of heartbeats drops below the expected threshold the server stops
    # evicting instances instead of removing still-healthy services.
    enable-self-preservation: ${EUREKA_SELF_PRESERVATION:true}
    # How often the EvictionTask runs: it expires leases AND decides whether
    # self-preservation mode should be entered/left (default 60s).
    eviction-interval-timer-in-ms: ${EUREKA_EVICTION_INTERVAL_MS:60000}
    # Expected percentage of heartbeats per minute before self-preservation kicks in.
    renewal-percent-threshold: ${EUREKA_RENEWAL_PERCENT_THRESHOLD:0.85}
    # How often the expected heartbeats-per-minute threshold is recalculated (15min).
    renewal-threshold-update-interval-ms: ${EUREKA_RENEWAL_THRESHOLD_UPDATE_MS:900000}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info,prometheus}
  endpoint:
    health:
      show-details: never
      # Liveness/readiness probes for container orchestrators:
      # /actuator/health/liveness and /actuator/health/readiness.
      probes:
        enabled: ${MANAGEMENT_HEALTH_PROBES:true}
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      console: logstash
