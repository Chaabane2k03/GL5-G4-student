server.port=8083
server.servlet.context-path=/enrollment

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:true}
eureka.instance.lease-renewal-interval-in-seconds=${EUREKA_LEASE_RENEWAL_INTERVAL_SECONDS:30}
eureka.instance.lease-expiration-duration-in-seconds=${EUREKA_LEASE_EXPIRATION_DURATION_SECONDS:90}

axon.axonserver.servers=${AXON_SERVER_URL:axon-server:8124}
# Record commands/events require Jackson (XStream cannot deserialize records);
# general stays XStream so already-stored tracking tokens remain readable.
axon.serializer.general=xstream
axon.serializer.events=jackson
axon.serializer.messages=jackson
axon.eventhandling.processors.enrollment.mode=tracking
