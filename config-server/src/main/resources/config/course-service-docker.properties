# Resilience4j protects the synchronous Feign dependency used during writes.
resilience4j.retry.instances.departmentService.max-attempts=3
resilience4j.retry.instances.departmentService.wait-duration=500ms
resilience4j.retry.instances.departmentService.enable-exponential-backoff=false
resilience4j.retry.instances.departmentService.retry-exceptions=feign.FeignException,java.io.IOException
resilience4j.ratelimiter.instances.departmentService.limit-for-period=5
resilience4j.ratelimiter.instances.departmentService.limit-refresh-period=1s
resilience4j.ratelimiter.instances.departmentService.timeout-duration=0
resilience4j.circuitbreaker.instances.departmentService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.departmentService.sliding-window-size=10
resilience4j.circuitbreaker.instances.departmentService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.departmentService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.departmentService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.departmentService.permitted-number-of-calls-in-half-open-state=2
spring.cloud.openfeign.client.config.department-service.connectTimeout=2000
spring.cloud.openfeign.client.config.department-service.readTimeout=5000
