server.port=8084
server.servlet.context-path=/course

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:true}
eureka.instance.lease-renewal-interval-in-seconds=${EUREKA_LEASE_RENEWAL_INTERVAL_SECONDS:30}
eureka.instance.lease-expiration-duration-in-seconds=${EUREKA_LEASE_EXPIRATION_DURATION_SECONDS:90}

resilience4j.retry.instances.departmentService.max-attempts=${RESILIENCE_RETRY_MAX_ATTEMPTS:3}
resilience4j.retry.instances.departmentService.wait-duration=${RESILIENCE_RETRY_WAIT_DURATION:500ms}
resilience4j.ratelimiter.instances.departmentService.limit-for-period=${RESILIENCE_RATE_LIMIT:5}
resilience4j.ratelimiter.instances.departmentService.limit-refresh-period=1s
resilience4j.ratelimiter.instances.departmentService.timeout-duration=0
resilience4j.circuitbreaker.instances.departmentService.sliding-window-size=10
resilience4j.circuitbreaker.instances.departmentService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.departmentService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.departmentService.wait-duration-in-open-state=10s
spring.cloud.openfeign.client.config.department-service.connectTimeout=2000
spring.cloud.openfeign.client.config.department-service.readTimeout=5000
