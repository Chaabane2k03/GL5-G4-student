{{- if .Values.externalSecrets.enabled }}
{{- $es := .Values.externalSecrets }}
{{- /*
External Secrets Operator (EKS only).

The credentials are stored in AWS Secrets Manager and synchronised into
Kubernetes Secrets by the External Secrets Operator. The Kubernetes Secrets
are named after the service, which is what the deployment of the service
consumes (`secret.existing` in the generic microservice chart).
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $es.aws.serviceAccount }}
  labels:
    app.kubernetes.io/part-of: gl5-student
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    # IRSA: the pod assumes this IAM role to call AWS Secrets Manager.
    eks.amazonaws.com/role-arn: {{ $es.aws.roleArn }}
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ $es.secretStore.name }}
  labels:
    app.kubernetes.io/part-of: gl5-student
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ $es.aws.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ $es.aws.serviceAccount }}
            namespace: {{ .Release.Namespace }}
---
{{- range $svc := $es.services }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $svc.name }}-secret
  labels:
    app.kubernetes.io/part-of: gl5-student
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.secretStore.name }}
    kind: {{ $es.secretStore.kind }}
  target:
    name: {{ $svc.name }}-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $property := $svc.properties }}
    - secretKey: {{ $property }}
      remoteRef:
        key: {{ $svc.remoteRef }}
        property: {{ $property }}
    {{- end }}
---
{{- end }}
{{- end }}
