{{- if .Values.staticContent.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "frontend.fullname" . }}-static
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
data:
  {{- range $path, $content := .Values.staticContent.files }}
  {{ $path }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}
