{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mysql.secretName" . }}
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
  {{- with .Values.secretAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  mysql-database: {{ .Values.database | quote }}
  mysql-user: {{ .Values.username | quote }}
  mysql-password: {{ .Values.password | quote }}
  mysql-root-password: {{ .Values.rootPassword | quote }}
{{- end }}
