{{- if and .Values.configMap.create (not .Values.configMap.existing) (not (empty .Values.config)) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "microservice.configMapName" . }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
  {{- with .Values.configMap.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
