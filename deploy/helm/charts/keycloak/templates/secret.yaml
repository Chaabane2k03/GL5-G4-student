apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keycloak.secretName" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-user: {{ .Values.adminUser | quote }}
  admin-password: {{ .Values.adminPassword | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keycloak.fullname" . }}-realm
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
data:
  realm.json: |
    {{- tpl (.Files.Get "files/realm.json.tpl") . | nindent 4 }}
