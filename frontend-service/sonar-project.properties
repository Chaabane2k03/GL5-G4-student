sonar.projectKey=cursus-frontend
sonar.projectName=Cursus Frontend
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=src/test
sonar.test.inclusions=src/test/**/*.spec.ts
sonar.exclusions=src/main.ts,src/**/*.d.ts
sonar.coverage.exclusions=src/main.ts
sonar.javascript.lcov.reportPaths=coverage/cursus-frontend/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json,tsconfig.spec.json
sonar.javascript.node.maxspace=4096
