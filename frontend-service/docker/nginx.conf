server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compression gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Sécurité HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Point de sonde de santé
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'OK';
    }

    # Configuration runtime : interdiction formelle de mise en cache
    location = /config.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location ^~ /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api-gateway:8072;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The browser and API share this origin. Do not expose the SPA's
        # Origin header to MVC backends that are not public CORS endpoints.
        proxy_set_header Origin "";
    }

    # /auth without a trailing slash would otherwise fall into the SPA.
    location = /auth {
        return 301 /auth/;
    }

    location ^~ /auth/ {
        # Keycloak is exposed publicly on /auth (KC_HOSTNAME includes the
        # prefix). The prefix is stripped here, so Keycloak itself stays on
        # its root context path.
        proxy_pass http://keycloak:8080/;
        proxy_http_version 1.1;
        # Keycloak 26 answers the login POST with several large Set-Cookie
        # headers (KC_RESTART carries the whole authentication session). The
        # 4k default header buffer overflows and nginx returns
        # 502 "upstream sent too big header while reading response header".
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fichiers statiques hachés : mise en cache immutable 1 an
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Routeur SPA Angular (Single Page Application Fallback)
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
